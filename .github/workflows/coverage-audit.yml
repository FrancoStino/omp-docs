name: coverage-audit

on:
  schedule:
    # Monthly, 1st day 07:00 UTC — one hour after the nightly sync slot.
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Full upstream checkout
        run: |
          # Full tree (not shallow): the audit walks every file, once a month.
          git clone --depth=1 https://github.com/can1357/oh-my-pi.git /tmp/upstream

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run coverage audit (mechanical, no AI)
        run: |
          bun scripts/coverage-audit.mjs /tmp/upstream content/docs coverage-report.md
          echo "## coverage-audit" >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.md
          if-no-files-found: error

      - name: AI write missing sections via omp
        id: ai
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          bun install -g @oh-my-pi/pi-coding-agent@18.5.1
          export OPENCODE_API_KEY="$AI_API_KEY"
          {
            echo "You maintain the documentation site in content/docs (Fumadocs MDX, site root, never /docs prefix)."
            echo ""
            echo "coverage-report.md lists upstream symbols NO local page mentions (certain gaps):"
            head -100 coverage-report.md
            echo ""
            echo "For each gap that is user-facing (new tool, command, backend, setting, model):"
            echo "1. Read the named upstream source file in /tmp/upstream for that symbol."
            echo "2. CREATE the page (no match) or EXTEND the closest page (partial match):"
            echo "   title+description frontmatter, sibling structure, Source footer, meta.json entry."
            echo "3. Never invent flags, defaults or behaviour not in the source file."
            echo "4. Skip internals (refactors, test helpers, crate plumbing). Print SKIPPED <symbol> <reason>."
            echo ""
            echo "When done, print one line per gap: CREATED/EXTENDED <path> or SKIPPED <symbol> <reason>."
          } > /tmp/coverage-prompt.md
          timeout 1500 omp -p --model "opencode-zen/muse-spark-1.3-contributor-free" \
            --config .github/omp-sync-config.yml \
            -e .github/omp-sync-extensions/opencode-zen-free.ts \
            < /tmp/coverage-prompt.md 2>&1 | tee omp-coverage.log || true
          git add -N -- content/docs
          REWRITTEN="$(git diff --name-only -- content/docs | wc -l | tr -d ' ')"
          echo "rewritten=${REWRITTEN:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "## omp coverage run (tail)"
            tail -40 omp-coverage.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload omp coverage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-coverage
          path: omp-coverage.log
          if-no-files-found: warn

      - name: Frontmatter/footer guard (+ links, lint, build)
        if: steps.ai.outputs.rewritten != '0'
        run: |
          FAIL=0
          TRACKED="$(git ls-files -- 'content/docs/**/*.mdx')"
          for f in $(git diff --name-only -- 'content/docs/**/*.mdx'); do
            case " $TRACKED " in
              *" $f "*) ;;
              *) continue ;;
            esac
            git diff -U0 -- "$f" | grep -qE '^\+(title|description):' && { echo "FRONTMATTER CHANGED: $f"; FAIL=1; }
            if git diff -U0 -- "$f" | grep -qE '^-.*Source: \[omp\.sh\]'; then
              echo "FOOTER REMOVED: $f"; FAIL=1;
            fi
          done
          exit $FAIL
          node scripts/check-links.mjs
          bun run lint
          bun run build

      - name: Open tracking issue (or PR when pages changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GAPS="$(grep -c '^- `' coverage-report.md || true)"
          REWRITTEN="${{ steps.ai.outputs.rewritten }}"
          BODY_FILE="$(mktemp)"
          if [ "${REWRITTEN:-0}" != "0" ]; then
            SHORT="cov-$(date -u +%F)"
            BRANCH="docs/coverage-$SHORT"
            git checkout -B "$BRANCH"
            git add content/docs
            REWRITTEN_FILES="$(git diff --cached --name-only -- content/docs)"
            [ -z "$REWRITTEN_FILES" ] && { echo "nothing staged, issue only"; }
            git -c user.name="docs-sync" -c user.email="docs-sync@users.noreply.github.com" commit -m "docs: fill coverage gaps ($SHORT)" || true
            git push -u origin "$BRANCH" --force-with-lease
            echo "$REWRITTEN_FILES" | head -30 > "$BODY_FILE.gaps"
            {
              echo "omp filled $REWRITTEN coverage gaps. Review the new/changed pages on the Preview deployment."
              echo
              echo "## pages"
              cat "$BODY_FILE.gaps"
              echo
              echo "## remaining gaps (still unfilled)"
              head -c 40000 coverage-report.md
            } > "$BODY_FILE"
          else
            TITLE="docs coverage audit: $GAPS gaps ($(date -u +%F))"
          fi
          if [ "${REWRITTEN:-0}" != "0" ]; then
            TITLE="docs coverage fill: $REWRITTEN pages ($(date -u +%F))"
          else
            TITLE="docs coverage audit: $GAPS gaps ($(date -u +%F))"
            {
              echo "Mechanical audit of upstream main vs local pages."
              echo "A listed symbol is never mentioned locally — a certain gap, not a guess."
              echo
              head -c 50000 coverage-report.md
            } > "$BODY_FILE"
          fi
          if [ "$(wc -c < "$BODY_FILE")" -ge 60000 ]; then
            head -c 60000 "$BODY_FILE" > "$BODY_FILE.cut"
            mv "$BODY_FILE.cut" "$BODY_FILE"
          fi
          if [ "${REWRITTEN:-0}" != "0" ]; then
            SHORT="cov-$(date -u +%F)"
            if gh pr list --head "$BRANCH" --json number -q '.[0].number' | grep -qE '[0-9]+'; then
              N="$(gh pr list --head "$BRANCH" --json number -q '.[0].number')"
              gh pr edit "$N" --body-file "$BODY_FILE"
            else
              gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE"
            fi
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label docs/coverage || \
              gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
