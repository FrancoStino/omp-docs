name: docs-sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      from_sha:
        description: 'Upstream SHA/tag to diff from (default: .docs-sync-state)'
        required: false
        default: ''
      to_sha:
        description: 'Upstream SHA/tag to diff to (default: origin/main HEAD)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve range
        id: range
        run: |
          LAST="${{ inputs.from_sha }}"
          if [ -z "$LAST" ]; then LAST="$(cat .docs-sync-state)"; fi
          # Tags, not main: docs follow releases. Resolve the newest release
          # tag via the GitHub API (one call) instead of `git fetch --tags`,
          # which pulls ~700 unrelated tags every run. When several tags
          # land the same day, TO is simply the newest one and the diff
          # LAST...TO covers every release in between in a single run —
          # no per-tag runs, no PR per release.
          # NOTE: `git fetch <url> main` never brings tags, and
          # `git describe` needs them — hence the explicit tag fetch below.
          TO_IN="${{ inputs.to_sha }}"
          UPSTREAM=https://github.com/can1357/oh-my-pi.git
          if [ -n "$TO_IN" ]; then
            case "$TO_IN" in
              v*[^0-9.]*) ;; # tag-like, fetch it below
            esac
            TO_TAG="$TO_IN"
          else
            TO_TAG="$(gh api repos/can1357/oh-my-pi/releases/latest -q .tag_name 2>/dev/null || git ls-remote --tags --refs "$UPSTREAM" 'v18.*' 2>/dev/null | awk -F/ '{print $NF}' | grep -v '{}' | sort -V | tail -1)"
          fi
          [ -z "$TO_TAG" ] && { echo "could not resolve latest release tag; aborting"; exit 1; }
          case "$TO_TAG" in
            v*)
              git fetch --depth=50 "$UPSTREAM" main
              git fetch --depth=50 "$UPSTREAM" tag "$TO_TAG"
              TO="$(git rev-parse FETCH_HEAD)"
              ;;
            *)
              # Raw SHA passed manually: resolve from main history.
              git fetch --depth=50 "$UPSTREAM" main
              TO="$TO_TAG"
              ;;
          esac
          echo "resolved TO=$TO (tag=$TO_TAG LAST=$LAST)"
          # Deepen until LAST is present, else fail explicit without writing state
          for i in 1 2 3 4; do
            git cat-file -e "$LAST" 2>/dev/null && break
            git fetch --deepen=100 https://github.com/can1357/oh-my-pi.git main
          done
          git cat-file -e "$LAST" || { echo "LAST $LAST not in history after deepen; aborting"; exit 1; }
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "to=$(git rev-parse "$TO")" >> "$GITHUB_OUTPUT"

      - name: Diff path-filtered
        id: diff
        run: |
          LAST="${{ steps.range.outputs.last }}"
          TO="${{ steps.range.outputs.to }}"
          # No path filter on purpose: a new feature can land anywhere
          # (new file, new package, new crate) and a filter would silently
          # skip it. Only test/snapshot noise is excluded. The AI script
          # itself caps at 20 pages, so a huge diff cannot explode costs —
          # unmapped files are reported, not rewritten.
          git diff --name-only "$LAST...$TO" -- ':!**/*.test.*' ':!**/*.snap*' ':!**/__snapshots__/*' > changed.txt || true
          if [ ! -s changed.txt ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
          git diff -U3 "$LAST...$TO" -- ':!**/*.test.*' ':!**/*.snap*' ':!**/__snapshots__/*' | head -c 200000 > code.diff
          git log --oneline "$LAST..$TO" > commits.txt
          {
            echo "Upstream diff $LAST -> $TO"
            echo
            echo "## commits"
            cat commits.txt
            echo
            echo "## changed files"
            cat changed.txt
          } > sync-body.md

      - name: Changelog (git-cliff)
        if: steps.diff.outputs.empty == 'false'
        run: |
          cargo install git-cliff --locked -q 2>/dev/null || true
          git cliff --from "${{ steps.range.outputs.last }}" --to "${{ steps.range.outputs.to }}" > cliff.md || git log --oneline "${{ steps.range.outputs.last }}..${{ steps.range.outputs.to }}" > cliff.md

      - name: Upload diff evidence
        if: steps.diff.outputs.empty == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sync-evidence
          path: |
            code.diff
            commits.txt
            cliff.md
            changed.txt

      - name: Setup Bun
        if: steps.diff.outputs.empty == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: AI rewrite via omp (headless agent)
        id: ai
        if: steps.diff.outputs.empty == 'false'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SYNC_FROM: ${{ steps.range.outputs.last }}
          SYNC_TO: ${{ steps.range.outputs.to }}
        run: |
          bun install -g @oh-my-pi/pi-coding-agent@18.5.1
          # Auth: OPENCODE_API_KEY alone is enough — omp resolves it natively
          # for opencode-zen (proven: dummy key reaches the model with 401,
          # not "No API key found"). No models.yml, no HOME/DIR hacks.
          # The vendored extension (-e) only pins opencode client headers
          # (403 workaround); the key comes from env, never from files.
          export OPENCODE_API_KEY="$AI_API_KEY"
          # Prompt from the evidence the previous steps already produced.
          # Simplified on purpose: rewrite directly from diff+page (no
          # EVIDENCE block in the same call — that is what truncated
          # Laguna output past the limit). Validation stays downstream.
          {
            echo "You maintain the documentation site in content/docs (Fumadocs MDX, site root, never /docs prefix)."
            echo ""
            echo "Upstream range: $SYNC_FROM -> $SYNC_TO. Changed files:"
            head -100 changed.txt
            echo ""
            echo "For each changed upstream file that maps to a local page by filename stem"
            echo "(e.g. docs/settings.md -> content/docs/<group>/settings.mdx, max 20 pages):"
            echo "1. Read the local page and the upstream diff for that file."
            echo "2. Rewrite ONLY what the diff changes. Keep YAML frontmatter byte-identical."
            echo "3. Keep the trailing Source footer byte-identical."
            echo "4. Never invent flags, commands, env vars or defaults not in the diff or the page."
            echo "5. Keep Steps/Tabs/Callout/Accordions/Cards structure. No imports. No <id> inside JSX."
            echo "6. Use codemode (parallel tool calls) when tracing one symbol across many pages."
            echo "7. If a file has no user-visible effect, leave its page unchanged."
            echo ""
            echo "When done, print one line per touched page: REWRITTEN <path> or SKIPPED <path> <reason>."
            echo "Retry rate-limited (429) tool/model calls up to 3 times with backoff before giving up on a page."
          } > /tmp/sync-prompt.md
          timeout 1500 omp -p --model "opencode-zen/muse-spark-1.3-contributor-free" \
            --config .github/omp-sync-config.yml \
            -e .github/omp-sync-extensions/opencode-zen-free.ts \
            < /tmp/sync-prompt.md 2>&1 | tee omp-run.log || true
          # Rewrite count = what omp actually changed. ai-sync.mjs is out of
          # the loop: it validated only its own EVIDENCE/PAGE format, which
          # omp never produces — every run ended Rewritten: 0 with omp's
          # output passing through unvalidated. Mechanical gates below
          # (frontmatter/footer check, check-links, lint, build) + human
          # review catch real damage instead.
          REWRITTEN="$(git diff --name-only -- content/docs | wc -l | tr -d ' ')"
          echo "rewritten=${REWRITTEN:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "## omp run log (tail)"
            tail -40 omp-run.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload omp run log
        if: steps.diff.outputs.empty == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-run
          path: omp-run.log
          if-no-files-found: warn

      - name: Frontmatter/footer guard
        if: steps.diff.outputs.empty == 'false'
        run: |
          # Diff-aware: fail only when the run REMOVES a Source footer or
          # touches frontmatter. Pages that already lacked a footer before
          # this run do not block the sync (backfill them separately).
          FAIL=0
          for f in $(git diff --name-only -- 'content/docs/**/*.mdx'); do
            git diff -U0 -- "$f" | grep -qE '^\+(title|description):' && { echo "FRONTMATTER CHANGED: $f"; FAIL=1; }
            if git diff -U0 -- "$f" | grep -qE '^-.*Source: \[omp\.sh\]'; then
              echo "FOOTER REMOVED: $f"; FAIL=1;
            fi
          done
          exit $FAIL

      - name: Build check
        if: steps.diff.outputs.empty == 'false'
        run: |
          bun install --frozen-lockfile
          bun run lint
          node scripts/check-links.mjs
          bun run build

      - name: Update state files
        # Only advance the cursor when the AI actually rewrote something.
        # A skipped run (missing MODEL) or 0-rewrite run must NOT mark pages
        # as synced, or the next run will silently skip them.
        if: steps.diff.outputs.empty == 'false' && steps.ai.outputs.rewritten != '0'
        run: |
          TO="${{ steps.range.outputs.to }}"
          echo "$TO" > .docs-sync-state
          printf '{"sha":"%s","date":"%s","source":"upstream-main"}\n' "$TO" "$(date -u +%F)" > public/sync-state.json
          {
            echo
            echo "## omp rewrite"
            echo
            git diff --name-only -- content/docs
          } >> sync-body.md

      - name: Open or update rolling PR
        if: steps.diff.outputs.empty == 'false' && steps.ai.outputs.rewritten != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TO="${{ steps.range.outputs.to }}"
          LAST="${{ steps.range.outputs.last }}"
          SHORT="$(echo "$TO" | cut -c1-7)"
          BRANCH="docs/sync-$SHORT"
          git checkout -B "$BRANCH"
          git add .docs-sync-state public/sync-state.json
          git add content/docs
          git -c user.name="docs-sync" -c user.email="docs-sync@users.noreply.github.com" commit -m "docs: sync upstream $SHORT" || true
          git push -u origin "$BRANCH" --force-with-lease
          N_FILES="$(wc -l < changed.txt | tr -d ' ')"
          N_COMMITS="$(wc -l < commits.txt | tr -d ' ')"
          BODY_FILE="$(mktemp)"
          {
            echo "Upstream diff $LAST -> $TO ($N_COMMITS commits, $N_FILES files)"
            echo
            echo "Full diff, commits, changelog and omp run log are in the run artifacts"
            echo "(\`sync-evidence\`, \`omp-run\`) — the body below is a summary."
            echo
            echo "## changed files"
            head -50 changed.txt
            [ "$(wc -l < changed.txt)" -gt 50 ] && echo "…and $(( $(wc -l < changed.txt) - 50 )) more (see artifact)"
            echo
            echo "## omp rewrite"
            git diff --name-only -- content/docs | head -30
          } > "$BODY_FILE"
          if [ "$(wc -c < "$BODY_FILE")" -ge 60000 ]; then
            head -c 60000 "$BODY_FILE" > "$BODY_FILE.cut"
            mv "$BODY_FILE.cut" "$BODY_FILE"
          fi
          BODY="$(cat "$BODY_FILE")"
          EXISTING="$(gh pr list --head "$BRANCH" --json number -q '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "docs: sync upstream $SHORT" --body "$BODY"
          fi
